name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Artifact-based Pages deployment: the build is uploaded and served directly,
# so nothing is force-pushed into git history. That matters here because every
# deploy carries ~16MB of textures and models, and a branch-published build
# accumulates those blobs in the repository.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Produces _site: the landing page at /, the game at /play/.
      - name: Build site
        run: npm run build:site

      # enablement turns Pages on and points it at Actions, so the repository
      # setting does not have to be flipped by hand first.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
